name: WOrkout source import and first Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workout-source-bootstrap
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Import uploaded source archive (if present)
        id: import
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(payload/source.part-*.b64)
          if (( ${#parts[@]} == 0 )); then
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No source payload in this push; nothing to import."
            exit 0
          fi
          cat "${parts[@]}" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/WOrkout-source.tar.xz"
          tar -tJf "$RUNNER_TEMP/WOrkout-source.tar.xz" >/dev/null
          mkdir -p "$RUNNER_TEMP/WOrkout-import"
          tar -xJf "$RUNNER_TEMP/WOrkout-source.tar.xz" -C "$RUNNER_TEMP/WOrkout-import"
          test -f "$RUNNER_TEMP/WOrkout-import/WOrkout/settings.gradle.kts"
          rsync -a "$RUNNER_TEMP/WOrkout-import/WOrkout/" "$GITHUB_WORKSPACE/"
          rm -rf payload
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import WOrkout Android source and feature modules"
            git push origin HEAD:main
          fi
          echo "has_source=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        if: steps.import.outputs.has_source == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.import.outputs.has_source == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        if: steps.import.outputs.has_source == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        if: steps.import.outputs.has_source == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify resources and privacy baseline
        if: steps.import.outputs.has_source == 'true'
        run: python3 scripts/verify_project.py

      - name: Run tests and build debug/release APKs
        if: steps.import.outputs.has_source == 'true'
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload test report
        if: always() && steps.import.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WOrkout-test-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload APK artifacts
        if: success() && steps.import.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WOrkout-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
